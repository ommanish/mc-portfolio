name: PR Checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with classic history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test adaptive UI
        run: npm test

      - name: Test analytics UI instrumentation
        run: npm run test:analytics-ui

      - name: Test analytics browser client
        run: npm run test:analytics-client

      - name: Test personalization logic
        run: node --test src/lib/personalization.test.js src/lib/hybridPersonalization.test.js

      - name: Test Worker protections and analytics
        run: node --test worker/src/index.test.js worker/src/analytics.test.js

      - name: Test experiment shell
        run: npm run test:experiment

      - name: Test analytics build injection
        run: npm run test:analytics-config

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build project
        run: npm run build
