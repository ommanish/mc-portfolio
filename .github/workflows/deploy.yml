name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build classic + adaptive experiment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository with classic history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test adaptive UI
        run: npm test

      - name: Test analytics UI instrumentation
        run: npm run test:analytics-ui

      - name: Test analytics browser client
        run: npm run test:analytics-client

      - name: Test personalization and security
        run: node --test src/lib/personalization.test.js src/lib/hybridPersonalization.test.js

      - name: Test Worker protections and analytics
        run: node --test worker/src/index.test.js worker/src/analytics.test.js

      - name: Test experiment shell
        run: npm run test:experiment

      - name: Test analytics build injection
        run: npm run test:analytics-config

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production configuration
        env:
          VITE_PORTFOLIO_API_BASE: ${{ vars.VITE_PORTFOLIO_API_BASE }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          test -n "$VITE_PORTFOLIO_API_BASE" || { echo "VITE_PORTFOLIO_API_BASE is missing"; exit 1; }
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "VITE_TURNSTILE_SITE_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" || { echo "CLOUDFLARE_WEB_ANALYTICS_TOKEN is missing"; exit 1; }

      - name: Build classic-default experiment
        env:
          VITE_PORTFOLIO_API_BASE: ${{ vars.VITE_PORTFOLIO_API_BASE }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CLASSIC_REF: 16a748974a2f2ecc98e22c9849c6a87c52e4ae3d
        run: npm run build:experiment

      - name: Validate assembled routes
        run: |
          test -f dist/index.html
          test -f dist/new/index.html
          test -f dist/portfolio-analytics.js
          test -f dist/case-studies/images/adaptive-ai-portfolio.png
          test -f dist/case-studies/pdfs/adaptive-ai-portfolio.pdf
          test -f dist/case-studies/adaptive-ai-portfolio/index.html
          test -f dist/case-studies/website-experience-refresh/index.html
          test -f dist/case-studies/accessibility-intelligence/index.html
          test -f dist/case-studies/ai-assisted-page-builder/index.html
          test -f dist/case-studies/web-experience-quality-score/index.html
          grep -q 'Try the new adaptive experience' dist/index.html
          grep -q 'Classic portfolio' dist/new/index.html
          grep -q '/new/assets/' dist/new/index.html
          grep -q 'portfolio-analytics-client' dist/index.html
          grep -q 'portfolio-analytics-client' dist/new/index.html
          grep -q 'cloudflare-web-analytics' dist/index.html
          grep -q 'cloudflare-web-analytics' dist/new/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
