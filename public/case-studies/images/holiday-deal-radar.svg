<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Holiday Deal Radar case study board</title>
  <desc id="desc">Hand-drawn project board showing deal discovery, price comparisons, and direct retailer links.</desc>
  <defs><pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 21.5H22" stroke="#e8e1d6" stroke-width=".7"/></pattern></defs>
  <rect width="1600" height="1000" fill="#f8f5ec"/><rect width="1600" height="1000" fill="url(#paper)" opacity=".45"/>
  <g fill="#171717" font-family="'Comic Sans MS','Bradley Hand',cursive" font-style="italic">
    <text x="48" y="64" font-size="26">Project 09</text><text x="350" y="76" font-size="52" font-weight="bold">HOLIDAY DEAL RADAR</text>
    <text x="42" y="132" font-size="25">Shopping discovery · Price context · Official retailer offers</text>
    <text x="65" y="208" font-size="29" fill="#1656c0">THE GOAL</text>
    <text x="65" y="252" font-size="24">Find useful offers.</text><text x="65" y="286" font-size="24">Understand the price.</text><text x="65" y="320" font-size="24">Choose with confidence.</text>
    <text x="65" y="410" font-size="29" fill="#1656c0">SHOPPER PATH</text>
    <text x="65" y="455" font-size="24">Browse → Filter</text><text x="65" y="489" font-size="24">→ Compare → Retailer</text>
    <text x="65" y="620" font-size="29" fill="#1656c0">LOCAL CONTEXT</text>
    <text x="65" y="668" font-size="23">Optional ZIP code</text><text x="65" y="702" font-size="23">Online offers stay visible</text>
    <text x="1140" y="203" font-size="24" fill="#1656c0">Search and categories</text><text x="1140" y="237" font-size="24" fill="#1656c0">make discovery easier</text>
    <text x="1140" y="490" font-size="24" fill="#1656c0">Price + savings + notes</text><text x="1140" y="524" font-size="24" fill="#1656c0">keep offers in context</text>
    <text x="1140" y="720" font-size="24" fill="#1656c0">Confirm stock and terms</text><text x="1140" y="754" font-size="24" fill="#1656c0">on the retailer's website</text>
    <text x="42" y="965" font-size="22">A focused holiday watchlist connecting product discovery with informed shopping.</text>
  </g>
