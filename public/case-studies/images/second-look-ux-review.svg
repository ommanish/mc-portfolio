<text x="804" y="410" font-size="14" fill="#a63728" font-weight="bold">1 · MAJOR</text><text x="804" y="438" font-size="18" font-weight="bold">Text contrast</text><text x="804" y="462" font-size="14">Evidence + a suggested fix</text>
<text x="804" y="523" font-size="14" fill="#a63728" font-weight="bold">2 · MAJOR</text><text x="804" y="551" font-size="18" font-weight="bold">Missing field label</text><text x="804" y="575" font-size="14">Explain what the input needs</text>
<text x="804" y="638" font-size="14" fill="#1656c0" font-weight="bold">FOLLOW UP</text><text x="804" y="666" font-size="18" font-weight="bold">Check the task by hand</text><text x="804" y="690" font-size="14">Automation is a starting point</text>
<text x="421" y="746" font-size="15" fill="#60646b">Illustrative report layout · sample findings</text><text x="421" y="776" font-size="15" fill="#60646b">JavaScript · Manifest V3 · local report storage</text>
</g>
<g fill="none" stroke="#1656c0" stroke-width="2.5" marker-end="url(#arrow)"><path d="M301 482Q354 457 405 454"/><path d="M1200 317Q1176 340 1140 391"/><path d="M1200 554Q1178 569 1141 565"/></g>
<rect x="390" y="844" width="770" height="66" rx="10" fill="#e8eddf"/>
<text x="775" y="886" text-anchor="middle" font-family="'Comic Sans MS','Bradley Hand',cursive" font-style="italic" font-size="26" fill="#34432a">Review → Understand → Prioritize → Verify</text>
<text x="48" y="965" font-family="'Comic Sans MS','Bradley Hand',cursive" font-style="italic" font-size="22" fill="#444">Product concept board · Automated checks support, not replace, human testing.</text>
