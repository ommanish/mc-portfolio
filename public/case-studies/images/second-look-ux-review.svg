<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Second Look browser UX review case study board</title>
<desc id="desc">Illustrated product board showing the review workflow, an annotated report concept, 45 automated checks, local report storage, and human validation.</desc>
<defs>
<pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 21.5H22" stroke="#e8e1d6" stroke-width=".7"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1656c0" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="1000" fill="#f8f5ec"/><rect width="1600" height="1000" fill="url(#paper)" opacity=".45"/>
<g font-family="'Comic Sans MS','Bradley Hand',cursive" font-style="italic" fill="#171717">
<text x="48" y="64" font-size="26">Project 08</text>
<text x="350" y="76" font-size="52" font-weight="bold">SECOND LOOK · UX REVIEW</text>
<text x="48" y="132" font-size="25">Browser extension · Accessibility · Launch readiness</text>
<text x="65" y="224" font-size="29" fill="#1656c0">THE GOAL</text>
<text x="65" y="270" font-size="24">Find what to fix</text><text x="65" y="306" font-size="24">before visitors do.</text>
<text x="65" y="419" font-size="29" fill="#1656c0">START ANYWHERE</text>
<text x="65" y="465" font-size="23">This page</text><text x="65" y="503" font-size="23">Another open tab</text><text x="65" y="541" font-size="23">A web address</text>
<text x="65" y="674" font-size="29" fill="#1656c0">BUILT FOR REVIEW</text>
<text x="65" y="720" font-size="23">45 automated checks</text><text x="65" y="758" font-size="23">10 usability heuristics</text><text x="65" y="796" font-size="23">Practical recommendations</text>
<text x="1210" y="224" font-size="28" fill="#1656c0">SEE THE EVIDENCE</text>
<text x="1210" y="270" font-size="22">Numbered screenshot pins</text><text x="1210" y="306" font-size="22">show where to look.</text>
<text x="1210" y="455" font-size="28" fill="#1656c0">PRIORITIZE</text>
<text x="1210" y="501" font-size="22">Issue → impact → fix</text><text x="1210" y="537" font-size="22">Go-live checklist</text><text x="1210" y="573" font-size="22">Save a report as PDF</text>
<text x="1210" y="704" font-size="28" fill="#1656c0">KEEP IT LOCAL</text>
<text x="1210" y="750" font-size="22">Reports in your browser</text><text x="1210" y="786" font-size="22">No account needed</text>
</g>
<g stroke="#25272b" stroke-width="2.5" stroke-linejoin="round">
<rect x="390" y="197" width="770" height="609" rx="15" fill="#fffdf7" transform="rotate(-.5 775 500)"/>
<path d="M392 249H1158" fill="none"/>
<circle cx="416" cy="224" r="5" fill="#efb6a2" stroke="none"/><circle cx="437" cy="224" r="5" fill="#e9cf75" stroke="none"/><circle cx="458" cy="224" r="5" fill="#b8cbb1" stroke="none"/>
</g>
<g font-family="Arial, sans-serif" fill="#25272b">
<text x="486" y="230" font-size="18" font-weight="bold">Second Look / review report</text><text x="421" y="290" font-size="23" font-weight="bold">A clearer path from finding to fix.</text>
