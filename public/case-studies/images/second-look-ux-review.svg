<rect x="440" y="405" width="304" height="28" rx="4" fill="#dad7ce"/>
<rect x="440" y="451" width="180" height="15" rx="4" fill="#b7bcc4"/><rect x="440" y="478" width="265" height="8" rx="4" fill="#d2d4d9"/>
<rect x="440" y="498" width="225" height="8" rx="4" fill="#d2d4d9"/>
