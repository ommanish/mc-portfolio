<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Vellum and Vector studio concept board</title><desc id="desc">Hand-drawn case study board showing the studio landing page, service hierarchy, and design notes.</desc>
  <defs><pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 21.5H22" stroke="#e8e1d6" stroke-width=".7"/></pattern></defs>
  <rect width="1600" height="1000" fill="#f8f5ec"/><rect width="1600" height="1000" fill="url(#paper)" opacity=".45"/>
  <g fill="#171717" font-family="'Comic Sans MS','Bradley Hand',cursive" font-style="italic">
    <text x="48" y="64" font-size="26">Project 7 of 7</text><text x="350" y="76" font-size="52" font-weight="bold">VELLUM &amp; VECTOR · STUDIO SITE</text>
    <text x="42" y="132" font-size="25">UI/UX consultancy · Website · Interface · Identity</text>
    <text x="65" y="208" font-size="29" fill="#1656c0">THE STORY</text><text x="65" y="252" font-size="24">A clear point of view.</text><text x="65" y="286" font-size="24">Four disciplines. One</text><text x="65" y="320" font-size="24">consistent experience.</text>
    <text x="65" y="408" font-size="29" fill="#1656c0">PAGE FLOW</text><text x="65" y="455" font-size="24">Value → Services → Work</text><text x="65" y="489" font-size="24">→ Process → Principles</text><text x="65" y="523" font-size="24">→ Questions → Contact</text>
    <text x="65" y="620" font-size="29" fill="#1656c0">INTERACTION NOTES</text><text x="65" y="668" font-size="23">Responsive layout</text><text x="65" y="702" font-size="23">Visible focus · reduced motion</text>
    <text x="1140" y="203" font-size="24" fill="#1656c0">Primary action is visible</text><text x="1140" y="237" font-size="24" fill="#1656c0">before the page gets long</text>
    <text x="1140" y="540" font-size="24" fill="#1656c0">Illustrative project types,</text><text x="1140" y="574" font-size="24" fill="#1656c0">not client case results</text>
    <text x="1140" y="760" font-size="24" fill="#1656c0">Contact form preview only</text>
    <text x="42" y="965" font-size="22">A concept for making the studio's work, process and next step easy to understand.</text>
  </g>
  <g transform="rotate(.7 800 490)" stroke="#171717" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="370" y="158" width="690" height="632" rx="14" fill="#fbf8f2"/><path d="M370 224h690"/><rect x="398" y="178" width="23" height="23" rx="4"/><rect x="410" y="168" width="23" height="23" rx="4" fill="#ff5a3c"/>
    <text x="447" y="199" fill="#171717" stroke="none" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Vellum &amp; Vector</text><text x="778" y="198" fill="#44444c" stroke="none" font-family="Arial,sans-serif" font-size="14">Services</text><text x="858" y="198" fill="#44444c" stroke="none" font-family="Arial,sans-serif" font-size="14">Work</text><rect x="935" y="175" width="100" height="36" rx="18" fill="#171717"/><text x="950" y="198" fill="#fbf8f2" stroke="none" font-family="Arial,sans-serif" font-size="12">Start a project</text>
    <text x="412" y="270" fill="#1656c0" stroke="none" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="2">UI/UX DESIGN CONSULTANCY</text>
    <text x="410" y="324" fill="#171717" stroke="none" font-family="Georgia,serif" font-size="35" font-weight="bold">Design that earns its</text><text x="410" y="366" fill="#171717" stroke="none" font-family="Georgia,serif" font-size="35" font-weight="bold">place on the <tspan fill="#b3301a">screen.</tspan></text>
    <text x="412" y="400" fill="#55545a" stroke="none" font-family="Arial,sans-serif" font-size="14">Websites, interfaces and identities shaped by clear decisions.</text>
    <rect x="410" y="423" width="195" height="42" rx="21" fill="#ff5a3c"/><text x="429" y="450" fill="#171717" stroke="none" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Tell us about your project →</text>
    <rect x="420" y="494" width="588" height="225" rx="12" fill="#e3ddf3"/>
    <rect x="460" y="526" width="505" height="158" rx="12" fill="#f2eee6" stroke-dasharray="8 7"/>
    <path d="M497 650h408" stroke="#cfc8ba"/><rect x="506" y="565" width="185" height="15" rx="5" fill="#171717"/><rect x="506" y="591" width="130" height="9" rx="4" fill="#8c877c"/><rect x="506" y="608" width="158" height="9" rx="4" fill="#8c877c"/><rect x="506" y="636" width="82" height="25" rx="13" fill="#ff5a3c"/>
    <rect x="739" y="552" width="183" height="105" rx="12" fill="#fbf8f2" stroke-width="2"/><rect x="772" y="578" width="115" height="52" rx="8" fill="#e3ddf3" stroke-width="2"/><circle cx="830" cy="604" r="20" fill="#ff5a3c" stroke="none"/>
    <text x="453" y="751" fill="#171717" stroke="none" font-family="monospace" font-size="13">ONE SCREEN · FIVE LAYERS OF DECISIONS</text>
    <path d="M330 330q20-16 42-16m-17-14 17 14-18 10" stroke="#1656c0" stroke-width="4"/><path d="M1070 442q34 8 46 32m0-21v21l-18-8" stroke="#1656c0" stroke-width="4"/>
    <path d="M45 91q116 6 232-2m92 10q280 12 570-5" stroke="#1656c0" stroke-width="4"/>
  </g>
  <rect x="1114" y="881" width="370" height="58" rx="8" fill="none" stroke="#1656c0" stroke-width="3" transform="rotate(-2 1114 881)"/><text x="1140" y="918" fill="#1656c0" font-family="'Comic Sans MS','Bradley Hand',cursive" font-size="24" font-style="italic">Clarity at every step</text>
</svg>
