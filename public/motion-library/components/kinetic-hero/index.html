<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Editorial Hero</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="mx-hero" data-mx-hero>
    <div class="mx-hero__ambient" aria-hidden="true">
      <span class="mx-hero__glow mx-hero__glow--one"></span>
      <span class="mx-hero__glow mx-hero__glow--two"></span>
      <span class="mx-hero__grid"></span>
    </div>

    <div class="mx-hero__content">
      <p class="mx-hero__eyebrow" data-mx-animate>Independent motion component · 01</p>

      <h1 class="mx-hero__title" aria-label="Build web experiences that feel alive">
        <span class="mx-hero__line"><span data-mx-word>Build web</span></span>
        <span class="mx-hero__line">
          <span data-mx-word>experiences that</span>
        </span>
        <span class="mx-hero__line mx-hero__line--accent">
          <span data-mx-word data-mx-accent>feel alive</span><span class="mx-hero__dot">.</span>
        </span>
      </h1>

      <p class="mx-hero__lede" data-mx-animate>
        A reusable hero pattern where typography, light, depth, and interaction move as one system—without taking over the page.
      </p>

      <div class="mx-hero__actions" data-mx-animate>
        <a class="mx-hero__primary" href="#experience">
          <span>Explore experience</span>
          <i aria-hidden="true">↗</i>
        </a>
        <button class="mx-hero__replay" type="button" data-mx-replay>
          Replay motion
        </button>
      </div>
    </div>

    <div class="mx-hero__visual" aria-hidden="true" data-mx-visual>
      <div class="mx-hero__card mx-hero__card--back"></div>
      <div class="mx-hero__card mx-hero__card--front">
        <span class="mx-hero__card-label">Web motion</span>
        <div class="mx-hero__card-art">
          <span></span><i></i><b></b>
        </div>
        <div class="mx-hero__card-footer">
          <span>Interaction</span><span>01 / 04</span>
        </div>
      </div>
    </div>

    <div class="mx-hero__scroll" aria-hidden="true" data-mx-animate>
      <span>Scroll to continue</span><i></i>
    </div>
  </section>

  <script src="./script.js"></script>
</body>
</html>
